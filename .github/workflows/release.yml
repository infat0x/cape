name: Release Plugin Package
run-name: "Release Automate Payload Extractor (${{ github.ref_name }}) by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Build, Sign, and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify main branch
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "Release can only be done on the main branch."
            exit 1
          fi

      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: npm install

      - name: Build distribution package (plugin_package.zip)
        run: npm run build

      - name: Digitally sign package (Ed25519)
        working-directory: dist
        run: |
          if [[ -z "${{ secrets.PRIVATE_KEY }}" ]]; then
            echo "Warning: PRIVATE_KEY secret not found, checking if signature already generated..."
            if [[ ! -f "plugin_package.zip.sig" ]]; then
              echo "Error: plugin_package.zip.sig not found and no PRIVATE_KEY secret provided."
              exit 1
            fi
          else
            echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem
            openssl pkeyutl -sign -inkey private_key.pem -out plugin_package.zip.sig -rawin -in plugin_package.zip
            rm private_key.pem
          fi

      - name: Read and validate package version
        id: meta
        working-directory: dist
        run: |
          VERSION=$(unzip -p plugin_package.zip manifest.json | jq -r .version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish immutable release to GitHub
        uses: caido/action-release@v1
        with:
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ steps.meta.outputs.version }}
          commit: ${{ github.sha }}
          body: 'Automate Payload Extractor v${{ steps.meta.outputs.version }}'
          artifacts: 'dist/plugin_package.zip,dist/plugin_package.zip.sig'
          immutableCreate: true
